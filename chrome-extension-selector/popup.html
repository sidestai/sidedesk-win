<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selector Picker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 18px;
      color: #333;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      color: #666;
    }

    .status {
      padding: 12px;
      background: white;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #2196F3;
    }

    .status.active {
      border-left-color: #4CAF50;
      background: #E8F5E9;
    }

    .status-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .selector-box {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .selector-box label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .selector-text {
      width: 100%;
      min-height: 60px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      resize: vertical;
      background: #f9f9f9;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2196F3;
      color: white;
    }

    .btn-primary:hover {
      background: #1976D2;
    }

    .btn-primary.active {
      background: #4CAF50;
    }

    .btn-secondary {
      background: #E0E0E0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #D0D0D0;
    }

    .options {
      background: white;
      border-radius: 8px;
      padding: 12px;
    }

    .option-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .option-item:last-child {
      margin-bottom: 0;
    }

    .option-item input[type="checkbox"] {
      margin-right: 8px;
    }

    .option-item label {
      font-size: 13px;
      color: #333;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 CSS Selector Picker</h1>
    <p>点击"开始选择"按钮，然后在页面上点击元素</p>
  </div>

  <div class="status" id="status">
    <div class="status-label">状态</div>
    <div class="status-value" id="statusValue">未激活</div>
  </div>

  <div class="button-group">
    <button class="btn-primary" id="toggleBtn">开始选择</button>
    <button class="btn-secondary" id="copyBtn">复制</button>
  </div>

  <div class="selector-box">
    <label>CSS Selector:</label>
    <textarea class="selector-text" id="selectorText" readonly placeholder="选择元素后将显示CSS Selector..."></textarea>
  </div>

  <div class="options">
    <div class="option-item">
      <input type="checkbox" id="useId" checked>
      <label for="useId">优先使用 ID</label>
    </div>
    <div class="option-item">
      <input type="checkbox" id="useClass">
      <label for="useClass">使用 Class</label>
    </div>
    <div class="option-item">
      <input type="checkbox" id="showTag" checked>
      <label for="showTag">显示标签名</label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
